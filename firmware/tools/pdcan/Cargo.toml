[package]
name = "pdcan"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_schema = "0.2"
pdcan-artifact.workspace = true
pdcan-protocol.workspace = true
pdcan-types.workspace = true
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4.0.0", default-features = false }

[dev-dependencies]
pdcan-sim = { path = "../pdcan-sim" }

[lints]
workspace = true
