[package]
name = "backplane-backpack-firmware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
board-rev-a = []
board-rev-b = []
firmware-bin = [
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-stm32",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embedded-can",
    "dep:panic-halt",
    "dep:portable-atomic",
    "dep:static_cell",
    "dep:stm32-metapac",
]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
embassy-executor = { version = "0.10", features = ["executor-thread", "platform-cortex-m"], optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-stm32 = { version = "0.6", default-features = false, features = ["rt", "stm32c092fc", "time", "time-driver-tim3"], optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5", optional = true }
embedded-can = { version = "0.4.1", optional = true }
panic-halt = { version = "1", optional = true }
portable-atomic = { version = "1.15", features = ["critical-section"], optional = true }
static_cell = { version = "2.1", optional = true }
stm32-metapac = { version = "21", features = ["stm32c092fc"], optional = true }
pdcan-core.workspace = true
pdcan-drivers.workspace = true
pdcan-protocol.workspace = true
pdcan-types.workspace = true

[[bin]]
name = "backplane-backpack"
path = "src/main.rs"
required-features = ["firmware-bin"]
test = false
bench = false

[lints]
workspace = true
