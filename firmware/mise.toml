[tools]
rust = "1.97.1"

[tasks.check]
description = "Run host tests, Clippy, DBC drift checks, and all firmware builds"
run = "cargo xtask ci"

[tasks.build]
description = "Build all Generation-2 firmware images"
run = "cargo xtask firmware build all --release"

[tasks.dbc]
description = "Regenerate the PDCAN DBC from protocol definitions"
run = "cargo xtask dbc"
