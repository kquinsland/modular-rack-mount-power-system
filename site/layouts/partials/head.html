<meta charset="UTF-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport">

<title>{{ partial "title" . }}{{ if not .IsHome }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Page.Params.description | default site.Params.description }}"/>
<link rel="icon" href='{{ "favicon.svg" | relURL }}' type="image/svg+xml"/>
<link rel="stylesheet" href='{{ "css/custom.css" | relURL }}'/>

{{- range .Translations }}
<link rel="alternate" hreflang="{{ default .Site.Language.Locale .Language.Lang }}" href="{{ .Permalink }}">
{{- end }}

{{- with .OutputFormats.Get "markdown" }}
<link rel="alternate" href="{{ .Permalink }}" type="{{ .MediaType.Type }}" title="{{ $.Title | default $.Site.Title }} Markdown">
{{- end }}
{{- with .Site.Home.OutputFormats.Get "llms" }}
<link rel="alternate" href="{{ .Permalink }}" type="{{ .MediaType.Type }}" title="{{ $.Site.Title }} llms.txt">
{{- end }}

{{- $script := resources.Get "js/dark.js" | resources.Minify }}
{{- with $script.Content }}
<meta name="color-scheme" content="light dark">
<script>{{ . | safeJS }}</script>
{{- end }}
