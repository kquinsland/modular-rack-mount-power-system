current_a = 5.5

[[scenarios.backplane-vcc.sinks]]
pad = "J2.1"
current_a = 5.5

[[scenarios.backplane-vcc.sinks]]
pad = "J3.1"
current_a = 5.5

[[scenarios.backplane-vcc.sinks]]
pad = "J4.1"
current_a = 5.5

[[scenarios.backplane-vcc.sinks]]
pad = "J5.1"
current_a = 5.5

[[scenarios.backplane-vcc.sinks]]
pad = "J6.1"
current_a = 5.5

[scenarios.carrier-vcc]
board = "hardware/boards/carrier/carrier.kicad_pcb"
net = "VCC"
source = "J1.1"
supply_voltage_v = 24
temperature_rises_c = [10, 20]
