[workspace]
resolver = "3"
members = [
    "crates/pdcan-core",
    "crates/pdcan-drivers",
    "crates/pdcan-protocol",
    "crates/pdcan-types",
    "firmware/backplane-backpack",
    "tools/pdcan",
    "tools/pdcan-sim",
    "xtask",
]
default-members = [
    "crates/pdcan-core",
    "crates/pdcan-drivers",
    "crates/pdcan-protocol",
    "crates/pdcan-types",
    "tools/pdcan",
    "tools/pdcan-sim",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
pdcan-core = { path = "crates/pdcan-core" }
pdcan-drivers = { path = "crates/pdcan-drivers" }
pdcan-protocol = { path = "crates/pdcan-protocol" }
pdcan-types = { path = "crates/pdcan-types" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
