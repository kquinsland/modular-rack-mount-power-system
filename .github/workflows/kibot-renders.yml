name: PCB WebP previews

on:
  push:
    paths:
      - ".github/workflows/kibot-renders.yml"
      - ".kibot/**"
      - "scripts/*pcb*.py"
      - "scripts/panel_layout.py"
      - "hardware/**"
  pull_request:
    paths:
      - ".github/workflows/kibot-renders.yml"
      - ".kibot/**"
      - "scripts/*pcb*.py"
      - "scripts/panel_layout.py"
      - "hardware/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Preview ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [carrier, backplane]
    steps:
      - name: Check out source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install uv
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: uv

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install pinned PCB tools
        run: mise run release:setup

      - name: Test release helpers
        run: mise run release:test

      - name: Render committed PCB to WebP
        run: python scripts/build_pcb_release.py preview --board "${{ matrix.board }}" --output "build/preview-${{ matrix.board }}"

      - name: Upload preview and provenance
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}-pcb-webp
          path: build/preview-${{ matrix.board }}/
          if-no-files-found: error
