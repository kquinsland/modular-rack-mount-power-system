name: Build PCB release artifacts
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to manufacture
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref }}
      - name: Install uv
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: uv
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Install pinned PCB tools
        run: mise run release:setup
      - name: Test release helpers
        run: mise run release:test
      - name: Build gated fabrication release
        run: mise run release:build
      - name: Upload complete reviewed artifact set
        uses: actions/upload-artifact@v7
        with:
          name: pcb-release
          path: build/pcb-release/
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pcb-release-diagnostics
          path: |
            build/pcb-release-work/*/logs/
            build/pcb-release-work/*/checks/
            build/pcb-release-work/*/vendors/*/checks/
