name: Firmware and PDCAN

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Host tests, protocol drift, and Rev A/B builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware -> target

      - name: Create SocketCAN integration interface
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

      - name: Validate workspace and firmware
        env:
          PDCAN_VCAN_INTERFACE: vcan0
        run: cargo xtask ci
