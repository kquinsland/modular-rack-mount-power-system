[settings]
activate_aggressive = true
env_cache = true
exec_auto_install = true
lockfile = true
pin = true
slsa = true

# Don't need windows support, just arm64/x64 mac/linux
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[settings.python]
uv_venv_auto = "create|source" # create .venv if missing, then activate

[settings.pipx]
uvx = true

[tools]
prek = "latest"
uv = "0.12.5"
rust = "1.97.1"
"github:mixelpixx/Konnect" = { version = "0.11.0", matching_regex = "^konnect-v", os = ["linux/x64", "macos/arm64"] }
"pipx:easyeda2kicad" = "1.0.1"
ripgrep = "15.2.0"

[tasks."firmware:check"]
description = "Run the host tests, generated-file checks, and Rev A firmware build"
run = "cargo xtask ci"

[tasks."firmware:build"]
description = "Build the Backplane Backpack Rev A firmware"
run = "cargo xtask firmware build --board rev-a --release"

[tasks."firmware:dbc"]
description = "Regenerate the PDCAN DBC from protocol definitions"
run = "cargo xtask dbc"

[tasks."wt32-eth01:submodule"]
description = "Initialize and update the WT32-ETH01 KiCad library submodule"
run = [
  "git submodule sync --recursive -- hardware/libraries/vendor/wt32-eth01",
  "git submodule update --init --recursive -- hardware/libraries/vendor/wt32-eth01",
]
