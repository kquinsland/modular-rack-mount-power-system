[settings]
activate_aggressive = true
env_cache = true
exec_auto_install = true
lockfile = true
pin = true
slsa = true

# Don't need windows support, just arm64/x64 mac/linux
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[env]
GH_REPO = "kquinsland/modular-rack-power"

[settings.python]
uv_venv_auto = "create|source" # create .venv if missing, then activate

[settings.pipx]
uvx = true

[tools]
hugo-extended = "0.166.0"
prek = "latest"
uv = "0.12.13"
rust = "1.98.1"
"github:mixelpixx/Konnect" = { version = "0.11.1", matching_regex = "^konnect-v", os = ["linux/x64", "macos/arm64"] }
"pipx:easyeda2kicad" = "1.0.1"
ripgrep = "15.2.0"

[tasks."firmware:check"]
description = "Check the firmware workspace and build both legacy board revisions"
run = "mise -C firmware run check"

[tasks."firmware:build"]
description = "Build the Backplane Backpack Rev A firmware"
run = "mise -C firmware run build"

[tasks."firmware:dbc"]
description = "Regenerate the PDCAN DBC from protocol definitions"
run = "mise -C firmware run dbc"

[tasks."site:build"]
description = "Validate and build the documentation site"
run = "site/scripts/build.sh"

[tasks."site:serve"]
description = "Run the local documentation server with drafts"
run = "hugo server --source site --buildDrafts"

[tasks."site:validate"]
description = "Validate documentation source and generated outputs"
run = "site/scripts/validate.sh"

[tasks."worklog:new"]
description = "Create a dated worklog entry with the required filename"
run = "site/scripts/new-worklog.sh"
