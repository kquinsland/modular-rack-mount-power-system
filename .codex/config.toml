[agents]
max_threads = 6
max_depth = 1

[mcp_servers.kicad]
# Note, must first run `mise run kicad-mcp:install` to fetch the MCP server (git submodule) and install dependencies.
command = "mise"
args = ["exec", "-C", ".", "--", "node", "kicad-mcp/server/dist/index.js"]

[mcp_servers.kicad.env]
LOG_LEVEL = "info"
NODE_ENV = "production"
